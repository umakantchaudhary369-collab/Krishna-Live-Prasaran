
name: Build Krishna Live Prasaran APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o KrishnaLivePrasaran_Phone_Starter.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd project
          find . -name settings.gradle -print
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Krishna-Live-Prasaran-APK
          path: project/**/*.apk
